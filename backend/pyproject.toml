[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt<4.1",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=12.3.0",
    "pydantic[email,email-validator]>=2.13.4",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ── dev 依赖组（测试 + 静态检查，不进生产）──
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "fakeredis>=2.20",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

# ── ruff 配置（lint + format）──
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E=pycodestyle错误 F=pyflakes I=isort W=pycodestyle警告 UP=pyupgrade
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
# 默认风格即 black 兼容，无需额外配置

# ── mypy 配置 ──
[tool.mypy]
python_version = "3.12"
# SQLAlchemy/FastAPI/redis 等库存根不全，忽略缺失存根避免误报
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
# 只检查 src/，tests/ 暂不强制类型（学习阶段放宽）
files = ["src"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

# ── pytest 配置（顺手加上，后面接口测试要用）──
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]