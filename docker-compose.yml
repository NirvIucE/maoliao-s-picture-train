# 猫里奥全栈云图库 — 一键启动编排（阶段 23）
#
# 使用方式：
#     cp backend/.env.example backend/.env      # 本地开发用（非必需）
#     cp .env.example .env                      # 可选：覆盖下方默认值（端口 / 密码 / AI Key）
#     docker compose up -d
#
# 设计说明：
# 1. 只有 3 个服务：mysql + redis + app。前端产物由 app 镜像内的后端托管
#    （main.py 提供 dist 静态资源与 SPA 回退），因此不需要 nginx 容器。
# 2. 变量来源是「仓库根 .env + 下方默认值」，**不使用 env_file**：compose 的 ${VAR}
#    插值不会读取 service 级 env_file，且仓库里没有 backend/.env（已 gitignore），
#    若依赖它会使得全新 clone 无法一键启动。
# 3. 宿主端口默认错开（MySQL 3307 / Redis 6380），避免与本机已装的
#    MySQL(3306) 与开发用 Redis(6379) 冲突。这两个端口仅用于调试，服务间通信走内部网络。

name: maoliao-picture-train

services:
  mysql:
    image: mysql:8.0
    container_name: maoliao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-maoliao_dev_pwd}
      MYSQL_DATABASE: ${DB_NAME:-cat_pic}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      # CMD-SHELL 才做变量展开；CMD（exec 形式）不会
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: maoliao-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: maoliao-app
    restart: unless-stopped
    depends_on:
      # service_healthy：等 MySQL 真正可连接，而不是"容器已启动"
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内以服务名互连（覆盖镜像里可能存在的 localhost 语义）
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-maoliao_dev_pwd}
      DB_NAME: ${DB_NAME:-cat_pic}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      # 密钥与 AI 配置：通过根 .env 注入，绝不写进镜像
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-maoliao-docker-dev-secret-please-change}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      AI_MODELS: ${AI_MODELS:-deepseek-chat|DeepSeek-V3|text|deepseek|tools,Qwen/Qwen3-VL-32B-Instruct|通义千问VL|vision|siliconflow}
      UPLOAD_ROOT: /app/uploads
      LOG_DIR: /app/logs
      TZ: Asia/Shanghai
    volumes:
      # 图片持久化：不挂卷则容器重建后全部图片丢失
      - uploads_data:/app/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mysql_data:
  redis_data:
  uploads_data:
